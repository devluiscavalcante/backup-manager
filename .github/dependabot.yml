version: 2
updates:
  # Saltos de versao major (Spring Boot, Angular, TypeScript, Tailwind...) exigem migracao
  # planejada e ficam fora. Patch e minor chegam juntos num unico PR por ecossistema.
  # Todos os PRs do Dependabot miram a develop: a master so recebe o merge da develop.
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      maven-minor-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      npm-minor-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: [ "*" ]

  # As tags das imagens (3.9-eclipse-temurin-21, 21-jre-alpine) ja recebem patches a cada build.
  # Build e runtime ficam presos ao JDK 21 do projeto; nenhum dos dois troca de versao major sozinho.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
