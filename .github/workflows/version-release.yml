name: Version Release Automation

on:
    push:
      tags: [ 'v*.*.*' ]
    workflow_dispatch:
      inputs:
        release_version:
          description: 'Release version (format: v1.0.0)'
          required: true
          default: 'v1.0.0'
          type: string

permissions:
    contents: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    create-release:
      name: Create GitHub Release
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Set up JDK 21
          uses: actions/setup-java@v6
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

        - name: Build Release Artifacts
          run: |
            mvn -B clean package -DskipTests
            echo "JAR file:"
            ls -lh target/*.jar

        - name: Get Version from Tag
          id: get_version
          env:
            INPUT_VERSION: ${{ github.event.inputs.release_version }}
          run: |
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              VERSION="$INPUT_VERSION"
            else
              VERSION="${GITHUB_REF#refs/tags/}"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Releasing version: $VERSION"

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v3
          with:
            tag_name: ${{ steps.get_version.outputs.version }}
            name: Release ${{ steps.get_version.outputs.version }}
            draft: false
            prerelease: false
            files: |
              target/*.jar
            generate_release_notes: true

        - name: Success
          run: |
            echo "Release ${{ steps.get_version.outputs.version }} created!"
            echo "Download: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }}"
            echo "Docker: ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}"
