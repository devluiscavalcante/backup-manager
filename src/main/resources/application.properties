spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backup_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${APP_PORT:8080}

logging.level.com.backup_manager=INFO

backup.exclusions=AppData, Temp, node_modules, .git, $RECYCLE.BIN
backup.retention.max-days=30
backup.retention.max-count=10

notification.enabled=${NOTIFICATION_ENABLED}
notification.email.enabled=true
notification.email.from=${NOTIFICATION_EMAIL_FROM}
notification.email.recipients=${NOTIFICATION_EMAIL_RECIPIENTS}
notification.email.notify-on-success=${NOTIFICATION_NOTIFY_SUCCESS}
notification.email.notify-on-failure=${NOTIFICATION_NOTIFY_FAILURE}
notification.email.notify-on-cancellation=false

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false