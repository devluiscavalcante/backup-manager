spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backup_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${APP_PORT:8080}

logging.level.com.backup_manager=INFO

backup.exclusions=AppData, Temp, node_modules, .git, $RECYCLE.BIN
backup.retention.max-days=30
backup.retention.max-count=10

notification.enabled=${NOTIFICATION_ENABLED:false}
notification.email.enabled=true
notification.email.from=${NOTIFICATION_EMAIL_FROM:noreply-test@engefort.com.br}
notification.email.recipients=${NOTIFICATION_EMAIL_RECIPIENTS:dev-test@engefort.com.br}
notification.email.notify-on-success=${NOTIFICATION_NOTIFY_SUCCESS:false}
notification.email.notify-on-failure=${NOTIFICATION_NOTIFY_FAILURE:false}
notification.email.notify-on-cancellation=true
notification.email.notify-on-started=true
notification.email.notify-on-scheduled=true

spring.mail.host=${MAIL_HOST:smtp.test.local}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:test@test.local}
spring.mail.password=${MAIL_PASSWORD:dummy-password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:change-me-now}
app.security.role=${APP_SECURITY_ROLE:ADMIN}
