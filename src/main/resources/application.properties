spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backup_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# out-of-order e baseline-on-migrate ficam desligados: o FlywayConfig liga cada um so no caso legado
# conhecido (V1_1 pendente; schema desta aplicacao sem historico). Defina-os aqui apenas para forcar.

server.port=${APP_PORT:8080}
app.version=${APP_VERSION:}

logging.level.com.backup_manager=INFO

backup.exclusions=AppData, Temp, node_modules, .git, $RECYCLE.BIN
# Crons que disparam com intervalo menor sao recusados na API e ignorados ao carregar do banco.
backup.scheduler.min-interval=${BACKUP_SCHEDULER_MIN_INTERVAL:5m}
# Snapshots mantidos por destino (o mais recente nunca e removido). Zero desliga o limite.
backup.retention.max-snapshots=${BACKUP_RETENTION_MAX_SNAPSHOTS:10}
backup.retention.max-days=${BACKUP_RETENTION_MAX_DAYS:0}

audit.retention.enabled=${AUDIT_RETENTION_ENABLED:true}
audit.retention.max-days=${AUDIT_RETENTION_MAX_DAYS:90}

# No encerramento, requisicoes e backups/restauracoes em andamento tem ate este prazo para terminar;
# o que passar disso vira FALHA (com notificacao) no proximo boot. No Docker, o stop_grace_period deve ser maior.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${APP_SHUTDOWN_TIMEOUT:30s}

notification.enabled=${NOTIFICATION_ENABLED:false}
notification.email.enabled=true
notification.email.from=${NOTIFICATION_EMAIL_FROM:noreply@example.com}
notification.email.recipients=${NOTIFICATION_EMAIL_RECIPIENTS:}
notification.email.notify-on-success=${NOTIFICATION_NOTIFY_SUCCESS:false}
# Falha exige acao e fica ligada por padrao; inicio e agendamento so geram ruido e ficam desligados.
notification.email.notify-on-failure=${NOTIFICATION_NOTIFY_FAILURE:true}
notification.email.notify-on-cancellation=${NOTIFICATION_NOTIFY_CANCELLATION:true}
notification.email.notify-on-started=${NOTIFICATION_NOTIFY_STARTED:false}
notification.email.notify-on-scheduled=${NOTIFICATION_NOTIFY_SCHEDULED:false}

spring.mail.host=${MAIL_HOST:smtp.test.local}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:test@test.local}
spring.mail.password=${MAIL_PASSWORD:dummy-password}

# SSL direto (465) por padrao; para STARTTLS (587) use MAIL_SSL_ENABLED=false e MAIL_STARTTLS_ENABLED=true.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_ENABLED:false}

app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:change-me-now}
app.security.role=${APP_SECURITY_ROLE:ADMIN}
app.security.operator-enabled=${APP_SECURITY_OPERATOR_ENABLED:false}
app.security.operator-username=${APP_SECURITY_OPERATOR_USERNAME:operator}
app.security.operator-password=${APP_SECURITY_OPERATOR_PASSWORD:change-me-operator}
app.security.operator-role=${APP_SECURITY_OPERATOR_ROLE:OPERATOR}
app.security.allow-default-password=${APP_SECURITY_ALLOW_DEFAULT_PASSWORD:false}
app.security.allowed-path-roots=${APP_SECURITY_ALLOWED_PATH_ROOTS:${user.home}}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:4200}
app.security.max-failed-logins=${APP_SECURITY_MAX_FAILED_LOGINS:10}
app.security.failed-login-lockout=${APP_SECURITY_FAILED_LOGIN_LOCKOUT:5m}
