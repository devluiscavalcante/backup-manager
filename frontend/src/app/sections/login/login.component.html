<main class="flex min-h-screen items-center justify-center bg-zinc-50 px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center text-center">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-zinc-900 text-white shadow-sm">
        <lucide-icon [name]="shieldIcon" class="h-5 w-5"></lucide-icon>
      </span>
      <h1 class="mt-4 text-xl font-semibold tracking-tight text-zinc-900">Backup Manager</h1>
      <p class="mt-1 text-sm text-zinc-500">Entre com sua conta para continuar.</p>
    </div>

    <form class="card space-y-5 p-6" (ngSubmit)="submit()" novalidate>
      <div>
        <label for="username" class="label">Usuário</label>
        <input id="username" name="username" class="input" [(ngModel)]="username"
               autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>

      <div>
        <label for="password" class="label">Senha</label>
        <input id="password" name="password" type="password" class="input" [(ngModel)]="password"
               autocomplete="current-password" required>
      </div>

      @if (error()) {
        <p class="rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700" role="alert">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary w-full" [disabled]="isSubmitting()">
        <lucide-icon [name]="loginIcon" class="h-4 w-4"></lucide-icon>
        {{ isSubmitting() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</main>
