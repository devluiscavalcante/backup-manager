<div class="min-h-screen flex items-center justify-center bg-white px-4">
  <div class="fixed inset-0 -z-10 opacity-[0.03]"
       style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 24px 24px;">
  </div>

  <form (ngSubmit)="submit()"
        class="w-full max-w-sm bg-white border border-gray-100 rounded-[2rem] p-8 shadow-sm space-y-6 animate-in fade-in duration-700">
    <div class="flex items-center gap-3">
      <div class="bg-gray-900 p-2 rounded-xl text-white shadow-lg">
        <lucide-icon [name]="shieldIcon" class="w-5 h-5"></lucide-icon>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tighter italic text-gray-900">BKM</h1>
        <p class="text-[10px] text-gray-400 uppercase tracking-[0.2em] font-bold">Backup Manager</p>
      </div>
    </div>

    <div class="space-y-4">
      <label class="block space-y-1.5">
        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Username</span>
        <input name="username" [(ngModel)]="username" autocomplete="username" required
               class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white transition-all">
      </label>

      <label class="block space-y-1.5">
        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Password</span>
        <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required
               class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:bg-white transition-all">
      </label>
    </div>

    @if (error()) {
      <p class="text-xs text-red-600 font-medium">{{ error() }}</p>
    }

    <button type="submit" [disabled]="isSubmitting()"
            class="w-full flex items-center justify-center gap-2 px-6 py-3 bg-gray-900 text-white rounded-2xl text-sm font-bold uppercase tracking-widest hover:bg-black disabled:opacity-40 transition-all active:scale-95">
      <lucide-icon [name]="loginIcon" class="w-4 h-4"></lucide-icon>
      <span>{{ isSubmitting() ? 'Signing in...' : 'Sign in' }}</span>
    </button>
  </form>
</div>
